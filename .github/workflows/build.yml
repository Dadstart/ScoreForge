name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ScoreForge.slnx

      - name: Build
        run: dotnet build ScoreForge.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ScoreForge.slnx -c Release --no-build --verbosity normal

      - name: Publish Desktop
        run: dotnet publish ScoreForge.Desktop/ScoreForge.Desktop.csproj -c Release --no-restore -o artifacts/desktop
